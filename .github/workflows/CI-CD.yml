name: CI/CD PIPELINE

on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    name: Build JAR
    runs-on: ubuntu-latest
    steps:
      - name: Fetch repository
        uses: actions/checkout@v4
      - name: setup java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: make java wrapper runnable
        run: chmod +x ./mvnw

      - name: build and save jar file.
        run:  ./mvnw -B clean package -DskipTests

      - name: save jar file
        uses: actions/upload-artifact@v4
        with:
          name: user-registration-api-jar
          path: target/user-registration-api-*.jar
          if-no-files-found: error
  test:
    name: automatic tests
    runs-on: ubuntu-latest
    needs: build
    if: success()

    steps:
      - name: fetch repository
        uses: actions/checkout@v4
      - name: set up java
        uses: actions/setup-java@v4
        with:
         java-version: '21'
         distribution: temurin
         cache: maven

      - name: make maven runnable
        run: chmod +x ./mvnw

      - name: Run tests
        run: ./mvwn -B test
      - name: Upload artifacts
        uses: upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          if-no-files-found: warn

  deploy:
    name: simulation deploy to staging
    runs-on: ubuntu-latest
    needs: test
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment: staging
    steps:
      - name: Fetch build results
        uses: actions/download-artifact@v4
        with:
          name: user-registration-api-jar
          path: deploy

      - name: show what should deploy
        run: |
          echo " All tests is approved on main" 
          echo " simulated deploy to staging" 
          ls-lh deploy 
          echo " A real deploy would use the environment safe credentials"